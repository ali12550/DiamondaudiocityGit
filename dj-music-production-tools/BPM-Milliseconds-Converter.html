<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BPM to Milliseconds Calculator | Diamond Audio City</title>


    <link rel="icon" href="/assets/imgs/diamond-audio-city.png" type="image/x-icon">

    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
    <link href="/assets/bootstrap5.css" rel="stylesheet">
    <link rel="stylesheet" href="/assets/style.css">
    <link href="/assets/tools.css" rel="stylesheet">

    <style>
        /* Extra Tool-Specific CSS Only (inherits tools.css) */
        .converter-row {
            display: flex;
            gap: 15px;
            align-items: center;
            justify-content: space-between;
        }

        .swap-btn {
            background: var(--accent);
            border-radius: 50%;
            width: 48px;
            height: 48px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: 0.2s;
        }

        .swap-btn:hover {
            opacity: .8;
        }

        .result-box p {
            margin: 6px 0;
        }
    </style>


    <!-- Google tag (gtag.js) -->
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-NCHP45VYJ2"></script>
    <script>
        window.dataLayer = window.dataLayer || [];
        function gtag() { dataLayer.push(arguments); }
        gtag('js', new Date());

        gtag('config', 'G-NCHP45VYJ2');
    </script>

    <script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-6855609395201774"
        crossorigin="anonymous"></script>
</head>

<body>
    <!-- Header Include -->
    <div id="header"></div>
    <div class="tool-container">
        <h1 class="tool-title">BPM ↔ Milliseconds Calculator</h1>

        <!-- Converter -->
        <div class="form-group">

            <div class="converter-row">
                <label id="inputLabel">BPM</label>
                <input type="number" id="inputValue" class="form-control" placeholder="Enter BPM">

                <div class="swap-btn" id="swapBtn" title="Swap Inputs">
                    🔁
                </div>

                <label id="outputLabel">Milliseconds</label>
            </div>

            <button class="btn-primary" onclick="calculate()">Convert</button>
        </div>

        <!-- Results -->
        <div class="result-box" id="results">
            Enter a value above to see results.
        </div>

    </div>

 <div id="footer"></div>
    <script src="/assets/bootstrap5.js" defer></script>
    <script src="/include.js"></script>

    <!--include js-->
    <script defer>


        window.addEventListener("load", () => {
            Promise.all([
                fetch("../../header.html").then(res => res.text()),
                fetch("../../footer.html").then(res => res.text())
            ])
                .then(([header, footer]) => {
                    document.getElementById("header").innerHTML = header;
                    document.getElementById("footer").innerHTML = footer;
                })
                .catch(err => console.error("Include load failed:", err));
        });

    </script>
<!-- tool js -->
    <script defer>
        let mode = "bpm-to-ms"; // or ms-to-bpm

        document.getElementById("swapBtn").onclick = () => {
            mode = mode === "bpm-to-ms" ? "ms-to-bpm" : "bpm-to-ms";

            if (mode === "bpm-to-ms") {
                document.getElementById("inputLabel").innerText = "BPM";
                document.getElementById("outputLabel").innerText = "Milliseconds";
                document.getElementById("inputValue").placeholder = "Enter BPM";
            } else {
                document.getElementById("inputLabel").innerText = "Milliseconds";
                document.getElementById("outputLabel").innerText = "BPM";
                document.getElementById("inputValue").placeholder = "Enter Milliseconds";
            }

            document.getElementById("results").innerHTML = "Enter a value above to see results.";
        };

        function calculate() {
            const val = parseFloat(document.getElementById("inputValue").value);
            let r = "";

            if (isNaN(val) || val <= 0) {
                r = "Please enter a valid positive number.";
                document.getElementById("results").innerHTML = r;
                return;
            }

            if (mode === "bpm-to-ms") {
                // BPM → ms
                const msPerBeat = 60000 / val;
                const secPerBeat = msPerBeat / 1000;
                const minPerBeat = secPerBeat / 60;
                const msPerBar = msPerBeat * 4; // 4/4 time

                r = `
            <p><strong>BPM:</strong> ${val.toFixed(2)}</p>
            <p><strong>Milliseconds per Beat:</strong> ${msPerBeat.toFixed(2)} ms</p>
            <p><strong>Milliseconds per 4/4 Bar:</strong> ${msPerBar.toFixed(2)} ms</p>
            <p><strong>Seconds per Beat:</strong> ${secPerBeat.toFixed(4)} s</p>
            <p><strong>Minutes per Beat:</strong> ${minPerBeat.toFixed(6)} min</p>
        `;
            } else {
                // ms → BPM
                const bpm = 60000 / val;

                r = `
            <p><strong>Milliseconds:</strong> ${val.toFixed(2)} ms</p>
            <p><strong>BPM:</strong> ${bpm.toFixed(2)}</p>
            <p><strong>Seconds:</strong> ${(val / 1000).toFixed(4)} s</p>
            <p><strong>Minutes:</strong> ${(val / 60000).toFixed(6)} min</p>
            <p><strong>Beats per Second:</strong> ${(1 / (val / 1000)).toFixed(4)}</p>
        `;
            }

            document.getElementById("results").innerHTML = r;
        }
    </script>




</body>

</html>
