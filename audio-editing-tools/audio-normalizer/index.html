<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Audio Normalizer | DiamondAudioCity</title>
    <meta name="description" content="Normalize your audio files online. Adjust volume levels to a consistent standard for MP3, WAV, and more.">
    <link rel="icon" href="/assets/imgs/diamond-audio-city.png" type="image/x-icon">

    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
    <link href="/assets/bootstrap5.css" rel="stylesheet">
    <link href="/assets/style.css" rel="stylesheet">
    <link href="/assets/tools.css" rel="stylesheet">
    <script src="https://unpkg.com/wavesurfer.js"></script>
</head>
<body>
    <div id="header"></div>

    <div class="container-fluid py-4">
        <div class="row">
            <!-- Sidebar -->
            <div class="col-lg-3 col-md-4">
                <div class="tools-sidebar">
                    <div class="sidebar-search mb-4">
                        <div class="input-group">
                            <span class="input-group-text"><i class="bi bi-search"></i></span>
                            <input type="text" class="form-control" id="toolSearch" placeholder="Search tools..." onkeyup="searchTools()">
                        </div>
                    </div>
                    <div class="sidebar-categories">
                        <div class="sidebar-category active">
                            <h5><i class="bi bi-music-note me-2"></i>Audio Editing Tools</h5>
                            <ul class="sidebar-links">
                                <li><a href="/audio-editing-tools/audio-trimmer/"><i class="bi bi-scissors"></i> Audio Trimmer</a></li>
                                <li><a href="/audio-editing-tools/audio-merger/"><i class="bi bi-union"></i> Audio Merger</a></li>
                                <li><a href="/audio-editing-tools/audio-normalizer/" class="active"><i class="bi bi-sliders"></i> Audio Normalizer</a></li>
                            </ul>
                        </div>
                    </div>
                </div>
            </div>

            <!-- Main Tool Section -->
            <div class="col-lg-9 col-md-8">
                <nav aria-label="breadcrumb">
                    <ol class="breadcrumb">
                        <li class="breadcrumb-item"><a href="/">Home</a></li>
                        <li class="breadcrumb-item"><a href="/audio-editing-tools/">Audio Editing</a></li>
                        <li class="breadcrumb-item active" aria-current="page">Audio Normalizer</li>
                    </ol>
                </nav>

                <div class="tool-container">
                    <div class="tool-title">
                        <h1><i class="bi bi-sliders me-2"></i>Audio Normalizer</h1>
                        <p>Upload an audio file to normalize its volume. Ensure consistent loudness across your tracks.</p>
                    </div>

                    <!-- Upload Area -->
                    <div class="upload-area mb-4 p-5 border-2 border-dashed rounded text-center" id="uploadArea">
                        <i class="bi bi-cloud-upload fs-1 text-teal mb-3 d-block"></i>
                        <h4>Drop audio file here</h4>
                        <p class="text-muted">or click to browse</p>
                        <input type="file" id="audioInput" accept="audio/*" class="d-none">
                        <button class="btn btn-primary mt-2" onclick="document.getElementById('audioInput').click()">
                            <i class="bi bi-folder2-open me-2"></i>Choose File
                        </button>
                    </div>

                    <!-- Waveform -->
                    <div id="waveform" class="mb-3" style="display:none;"></div>

                    <!-- Controls -->
                    <div id="controls" style="display:none;" class="mb-3 d-flex gap-3">
                        <button class="btn btn-primary" id="playPauseBtn"><i class="bi bi-play-fill"></i> Play</button>
                        <button class="btn btn-outline-secondary" onclick="resetTool()"><i class="bi bi-arrow-repeat"></i> Upload New</button>
                    </div>

                    <!-- Download Button -->
                    <div id="downloadSection" style="display:none;">
                        <button class="btn btn-primary" id="downloadBtn"><i class="bi bi-download me-2"></i>Download Normalized Audio</button>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <div id="footer"></div>

    <script src="/assets/bootstrap5.js"></script>
    <script src="/assets/tools.js" defer></script>

    <script>
        let wavesurfer;
        let audioBuffer;
        let normalizedBlob;

        const audioInput = document.getElementById('audioInput');
        const playPauseBtn = document.getElementById('playPauseBtn');

        audioInput.addEventListener('change', async (e) => {
            if(e.target.files.length === 0) return;
            const file = e.target.files[0];

            document.getElementById('uploadArea').style.display = 'none';
            document.getElementById('waveform').style.display = 'block';
            document.getElementById('controls').style.display = 'flex';
            document.getElementById('downloadSection').style.display = 'block';

            if (wavesurfer) wavesurfer.destroy();

            wavesurfer = WaveSurfer.create({
                container: '#waveform',
                waveColor: '#6c757d',
                progressColor: '#20c997',
                height: 120,
                normalize: true,
                responsive: true
            });

            const fileURL = URL.createObjectURL(file);
            wavesurfer.load(fileURL);

            // Normalize audio
            const arrayBuffer = await file.arrayBuffer();
            const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            audioBuffer = await audioCtx.decodeAudioData(arrayBuffer);

            const channelData = [];
            let peak = 0;
            for(let i=0; i<audioBuffer.numberOfChannels; i++){
                const data = audioBuffer.getChannelData(i);
                channelData.push(data);
                for(let j=0;j<data.length;j++){
                    if(Math.abs(data[j]) > peak) peak = Math.abs(data[j]);
                }
            }

            // Calculate gain to normalize to -1..1
            const gain = 1 / peak;
            const newBuffer = audioCtx.createBuffer(audioBuffer.numberOfChannels, audioBuffer.length, audioBuffer.sampleRate);

            for(let i=0;i<audioBuffer.numberOfChannels;i++){
                const data = audioBuffer.getChannelData(i);
                const newData = newBuffer.getChannelData(i);
                for(let j=0;j<data.length;j++){
                    newData[j] = data[j]*gain;
                }
            }

            // Convert to WAV Blob
            normalizedBlob = bufferToWavBlob(newBuffer);
        });

        playPauseBtn.addEventListener('click', () => {
            if (!wavesurfer) return;
            wavesurfer.playPause();
            playPauseBtn.innerHTML = wavesurfer.isPlaying() ? '<i class="bi bi-pause-fill"></i> Pause' : '<i class="bi bi-play-fill"></i> Play';
        });

        document.getElementById('downloadBtn').addEventListener('click', () => {
            if (!normalizedBlob) return;
            const a = document.createElement('a');
            a.href = URL.createObjectURL(normalizedBlob);
            a.download = 'normalized_audio.wav';
            a.click();
        });

        function bufferToWavBlob(buffer) {
            const numChannels = buffer.numberOfChannels;
            const sampleRate = buffer.sampleRate;
            const format = 1;
            const bitDepth = 16;
            const bytesPerSample = bitDepth/8;
            const blockAlign = numChannels * bytesPerSample;
            const dataLength = buffer.length * blockAlign;
            const bufferLength = 44 + dataLength;
            const arrayBuffer = new ArrayBuffer(bufferLength);
            const view = new DataView(arrayBuffer);

            function writeString(view, offset, string){
                for(let i=0;i<string.length;i++){
                    view.setUint8(offset+i,string.charCodeAt(i));
                }
            }

            writeString(view,0,'RIFF');
            view.setUint32(4,36+dataLength,true);
            writeString(view,8,'WAVE');
            writeString(view,12,'fmt ');
            view.setUint32(16,16,true);
            view.setUint16(20,format,true);
            view.setUint16(22,numChannels,true);
            view.setUint32(24,sampleRate,true);
            view.setUint32(28,sampleRate*blockAlign,true);
            view.setUint16(32,blockAlign,true);
            view.setUint16(34,bitDepth,true);
            writeString(view,36,'data');
            view.setUint32(40,dataLength,true);

            let pos = 44;
            for(let i=0;i<buffer.length;i++){
                for(let ch=0;ch<numChannels;ch++){
                    const sample = Math.max(-1, Math.min(1, buffer.getChannelData(ch)[i]));
                    view.setInt16(pos, sample<0?sample*0x8000:sample*0x7FFF,true);
                    pos+=2;
                }
            }

            return new Blob([arrayBuffer], {type:'audio/wav'});
        }

        function resetTool(){
            if (wavesurfer) wavesurfer.destroy();
            document.getElementById('uploadArea').style.display = 'block';
            document.getElementById('waveform').style.display = 'none';
            document.getElementById('controls').style.display = 'none';
            document.getElementById('downloadSection').style.display = 'none';
            audioInput.value='';
        }

        window.addEventListener("load", () => {
            Promise.all([
                fetch("../../header.html").then(res => res.text()),
                fetch("../../footer.html").then(res => res.text())
            ])
            .then(([header, footer]) => {
                document.getElementById("header").innerHTML = header;
                document.getElementById("footer").innerHTML = footer;
            })
            .catch(err => console.error("Include load failed:", err));
        });
    </script>
</body>
</html>
